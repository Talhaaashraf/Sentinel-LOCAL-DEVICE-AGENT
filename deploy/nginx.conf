# Sentinel reverse proxy. Fronts the FastAPI backend; the app serves its own
# static files, API, install scripts and the /ws/monitor WebSocket, so we proxy
# everything and keep the backend's auth and routing authoritative.

upstream sentinel_backend {
    server backend:8000;
}

# Map for WebSocket upgrade (Connection header depends on Upgrade being present).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Agent uploads (network speed-test posts up to ~500 MB) and bundle downloads.
    client_max_body_size 600m;

    location / {
        proxy_pass http://sentinel_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/ws/monitor) upgrade support.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-running operations: updates, SFC/DISM repair, stress tests.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Stream large uploads straight through instead of buffering to disk.
        proxy_request_buffering off;
    }
}

