# Sentinel — Docker stack: nginx (public) -> backend (FastAPI) -> ollama (LLM brain).
# Quick start:
#   cp .env.docker.example .env   # then edit the secrets
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:3b-instruct   # one time
#   open http://<this-host>/

services:
  backend:
    build: .
    image: sentinel-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # These point the app at the sibling container and the data volume; they
      # override anything in .env so the containerized paths are always right.
      OLLAMA_URL: http://ollama:11434
      SENTINEL_DB: /app/data/alerts.db
      LLM_PROVIDER: ollama
    volumes:
      - sentinel-data:/app/data
      - decisions-cases:/app/decisions/cases
    expose:
      - "8000"
    depends_on:
      - ollama

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # uncomment with the TLS block in deploy/nginx.conf
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Publish 11434 only if you also want to reach Ollama directly from the host.
    # ports:
    #   - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  sentinel-data:
  decisions-cases:
  ollama-data:
